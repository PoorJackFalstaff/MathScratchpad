<!DOCTYPE html>
<html lang="en" >
<head>
  <meta charset="UTF-8">
  <title>CodePen - Canvas Drawing</title>
  <link rel = "stylesheet" href = "../reset.css">
  <link rel = "stylesheet" href = "../styles/draw.css">
  <script type = "module" src = "../js/draw.js"></script>
</head>
<body>
<!-- partial:index.partial.html -->
<canvas id = "draw"></canvas>
<canvas id = "overlay"></canvas>

<div id = "tools">
  <div id = "colors" class = "tool">
    <div id = "red_stroke" class = "color"></div>
    <div id = "blue_stroke" class = "color"></div>
    <div id = "black_stroke" class = "color"></div>
    <div id = "green_stroke" class = "color"></div>
    <div id = "purple_stroke" class = "color"></div>
    <div id = "pink_stroke" class = "color"></div>
    <div id = "gray_stroke" class = "color"></div>
    <div id = "yellow_stroke" class = "color"></div>
    <div id = "chartreuse_stroke" class = "color"></div>
    <div id = "orange_stroke" class = "color"></div>
  </div> <!--END COLORS-->
  
  <div id = "colors_size_chosen" class = "tool">

    <div id = "colors_chosen">
      <div></div>
      <div></div>
    </div>

    <div id = "size_chosen">
      <div class = "selectable"> 
        <svg height = 100% width = 100% >
          <line x1="50%" y1="10%" x2="50%" y2="90%" style="stroke:rgb(0,0,0);stroke-width:1" />
        </svg>
      </div>

      <div class = "selectable selected">
        <svg height = 100% width = 100% >
          <line x1="50%" y1="10%" x2="50%" y2="90%" style="stroke:rgb(0,0,0);stroke-width:3" />
        </svg>
      </div>

      <div class = "selectable">
        <svg height = 100% width = 100% >
          <line x1="50%" y1="10%" x2="50%" y2="90%" style="stroke:rgb(0,0,0);stroke-width:5" />
        </svg>
      </div>

      <div class = "selectable">
        <svg height = 100% width = 100% >
          <line x1="50%" y1="10%" x2="50%" y2="90%" style="stroke:rgb(0,0,0);stroke-width:7" />
        </svg>
      </div>

    </div>
  </div>
  
  <div id = "shapes" class = "tool">

    <div id = "pen" class = "shape selectable selected">
      <svg viewBox="0 0 512 512" height = 100% width= 100% title="pen-alt">
        <path d="M10 10" />
      </svg>
    </div>

    <div id = "line" class = "shape selectable">
      <svg height = 100% width = 100% viewBox = "0 0 100 100" preserveAspectRatio = "none">
        <line x1="10" y1="50" x2="90" y2="50" style="stroke:rgb(0,0,0);stroke-width:4" />
      </svg>
    </div>

    <div id = "vector" class = "shape selectable">
      <svg height = 100% width = 100% viewBox = "0 0 100 100" preserveAspectRatio = "none">
        <line x1="50" y1="70" x2="50" y2="40" style="stroke:rgb(0,0,0);stroke-width:4" />
        <polygon points = "40,40 60,40 50,30" style="fill:rgb(0,0,0); stroke:rgb(0,0,0);stroke-width:4"/>
      </svg>
    </div>

<!--     <div id = "eraser" class = "shape"></div> -->
    <div id = "rectangle" class = "shape selectable">
      <svg height = 100% width = 100%>
        <rect x="5%" y="5%" width="90%" height="90%" style="fill:none; stroke:rgb(0,0,0);stroke-width:2"/>
      </svg>
    </div>

    <div id = "table" class = "shape selectable">
      <svg height = 100% width = 100% viewBox = "0 0 100 100" preserveAspectRatio = "none">
        <path d = "M5 5 95 5 M5 35 95 35 M5 65 95 65 M5 95 95 95" style = "stroke:rgb(0,0,0);stroke-width:2"/> <!--Horizontal lines-->
        <path d = "M5 5 5 95 M35 5 35 95 M65 5 65 95 M95 5 95 95" style = "stroke:rgb(0,0,0);stroke-width:2"/> <!--Vertical lines-->
      </svg>
    </div>

    <div id = "cartesian" class = "shape selectable">
      <svg height = 100% width = 100% viewBox = "0 0 100 100" preserveAspectRatio = "none">
        <path d = "M5 5 95 5 M5 27.5 95 27.5 M5 72.5 95 72.5 M5 95 95 95" style = "stroke:rgb(0,0,0); stroke-width:1"/><!-- Horizontal lines, excluding x axis -->
        <path d = "M5 50 95 50 M50 5 50 95" style = "stroke:rgb(0,0,0); stroke-width: 3"/><!-- Axes -->
        <path d = "M5 5 5 95 M27.5 5 27.5 95 M72.5 5 72.5 95 M95 5 95 95" style = "stroke:rgb(0,0,0); stroke-width:1"/><!--Vertical lines, excluding y axis -->
      </svg>
    </div>
    
    <div class = "shape selectable"></div>
    <div class = "shape selectable"></div>
    <div class = "shape selectable"></div>
    <div class = "shape selectable"></div>
    <div class = "shape selectable"></div>
  </div> <!--END SHAPES-->
  
  <div id = "menu">
    <button id = "clear" class = "tool">CLEAR</button>
  </div> <!--END MENU-->
</div> <!--END TOOLS-->
<!-- partial -->


</body>
</html>
